  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  *{box-sizing:border-box;margin:0;padding:0}\n  body{font-family:'Manrope',sans-serif;color:#211633;background:#FBFAFD;-webkit-font-smoothing:antialiased;line-height:1.5}\n  h1,h2,h3,h4{font-family:'Plus Jakarta Sans',sans-serif;line-height:1.2;letter-spacing:-0.02em}\n  a{text-decoration:none;color:inherit}\n  a:link,a:visited{color:inherit}\n  a:hover{color:#600C90}\n  ::selection{background:#FFC02E;color:#3C0960}\n  table{border-collapse:collapse;width:100%}\n  @media (max-width:1180px){\n    .gm-d-grid{grid-template-columns:minmax(0,1fr) 320px !important}\n    .gm-d-left{order:3 !important;grid-column:1 / -1 !important}\n    .gm-d-main{order:1 !important}\n    .gm-d-right{order:2 !important}\n    .gm-d-cal{max-width:420px !important}\n  }\n  @media (max-width:880px){\n    .gm-d-grid{grid-template-columns:1fr !important;gap:18px !important}\n    .gm-d-left,.gm-d-main,.gm-d-right{grid-column:auto !important}\n    .gm-d-shell{padding:12px 18px !important}\n    .gm-d-page{padding:20px 18px 56px !important}\n    .gm-d-welcome{padding:26px 24px !important}\n    .gm-d-wtitle{font-size:24px !important}\n    .gm-d-books{display:none !important}\n    .gm-d-cards{grid-template-columns:repeat(2,minmax(0,1fr)) !important}\n    .gm-d-cal{max-width:none !important}\n  }\n  @media (max-width:520px){\n    .gm-d-page{padding:16px 14px 48px !important}\n    .gm-d-shell{padding:10px 14px !important}\n    .gm-d-logo{height:34px !important}\n    .gm-d-welcome{padding:22px 18px !important;border-radius:20px !important}\n    .gm-d-wtitle{font-size:21px !important}\n    .gm-d-card{padding:18px 16px !important}\n    .gm-d-cards{grid-template-columns:1fr !important}\n    .gm-d-caldays span{font-size:11px !important}\n    .gm-d-picks{gap:10px !important}\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#FBFAFD\">\n\n  <!-- APP SHELL -->\n  <header style=\"background:#fff;border-bottom:1px solid #EDE7F3;position:sticky;top:0;z-index:20\">\n    <div class=\"gm-d-shell\" style=\"max-width:1440px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:18px\">\n      <div style=\"display:inline-flex;align-items:center;justify-content:center;padding:8px;border-radius:6px;cursor:pointer;color:#9CA3AF\">\n        <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <a href=\"Index.dc.html\" style=\"display:flex;align-items:center\"><img class=\"gm-d-logo\" src=\"99ab86e8-7879-41a7-8cf8-cf2ce9b22491\" alt=\"GAMAI\" style=\"height:44px;width:auto;display:block\"><\u002Fa>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;cursor:pointer;padding-right:8px\">\n        <img src=\"7a48ea4b-d538-498c-84d1-f11a586d665a\" alt=\"user image\" style=\"width:24px;height:24px;border-radius:999px;object-fit:cover;background:#EDE7F3;display:block\">\n        <svg width=\"10\" height=\"5\" sc-camel-view-box=\"0 0 12 7\" fill=\"none\"><path d=\"M1 1L6 6L11 1\" stroke=\"#BDBDBD\" stroke-width=\"1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div class=\"gm-d-page\" style=\"max-width:1440px;margin:0 auto;padding:26px 28px 72px\">\n    <div class=\"gm-d-grid\" style=\"display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:24px;align-items:start\">\n\n      <!-- LEFT RAIL: calendar + summary -->\n      <div class=\"gm-d-left\" style=\"order:1;display:flex;flex-direction:column;gap:20px\">\n        <div class=\"gm-d-card gm-d-cal\" style=\"background:#fff;border:1px solid #EBE6F1;border-radius:20px;padding:22px;box-shadow:0 10px 28px rgba(60,9,96,0.05)\">\n          <h2 style=\"font-size:17px;font-weight:800;color:#2C1947\">Your bookings<\u002Fh2>\n          <div style=\"font-size:13.5px;color:#7A5A9A;margin-top:4px;font-weight:600\">{{ cal.monthLabel }}<\u002Fdiv>\n\n          <div class=\"gm-d-caldays\" style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:16px;text-align:center\">\n            <sc-for list=\"{{ cal.dayNames }}\" as=\"d\" hint-placeholder-count=\"7\">\n              <span style=\"font-size:11.5px;font-weight:800;color:#B7A6C9;letter-spacing:0.02em;padding-bottom:6px\">{{ d }}<\u002Fspan>\n            <\u002Fsc-for>\n            <sc-for list=\"{{ cal.cells }}\" as=\"c\" hint-placeholder-count=\"35\">\n              <div style=\"height:34px;display:flex;align-items:center;justify-content:center\">\n                <span style=\"width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:999px;font-size:13px;font-weight:{{ c.weight }};color:{{ c.color }};background:{{ c.bg }};cursor:{{ c.cursor }}\">{{ c.label }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid #F1EAF7\">\n            <span style=\"width:12px;height:12px;border-radius:999px;background:#600C90;flex:none\"><\u002Fspan>\n            <span style=\"font-size:12.5px;color:#5C5470\">{{ cal.legend }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"gm-d-card\" style=\"background:#fff;border:1px solid #EBE6F1;border-radius:20px;padding:22px;box-shadow:0 10px 28px rgba(60,9,96,0.05)\">\n          <h2 style=\"font-size:17px;font-weight:800;color:#2C1947\">Course progress<\u002Fh2>\n          <div style=\"display:flex;align-items:center;gap:18px;margin-top:18px\">\n            <div style=\"flex:none;width:96px;height:96px;border-radius:999px;background:{{ summary.ring }};display:flex;align-items:center;justify-content:center\">\n              <div style=\"width:70px;height:70px;border-radius:999px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center\">\n                <span style=\"font-family:'Plus Jakarta Sans';font-weight:800;font-size:22px;color:#2C1947;line-height:1\">{{ summary.total }}<\u002Fspan>\n                <span style=\"font-size:10.5px;font-weight:700;color:#9C8AB2;text-transform:uppercase;letter-spacing:0.06em\">total<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:11px;min-width:0\">\n              <sc-for list=\"{{ summary.rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:9px\">\n                  <span style=\"width:9px;height:9px;border-radius:3px;background:{{ r.color }};flex:none\"><\u002Fspan>\n                  <span style=\"font-size:13px;color:#5C5470\">{{ r.label }}<\u002Fspan>\n                  <span style=\"font-size:13px;font-weight:800;color:#2C1947\">{{ r.value }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- MAIN: welcome + timetable -->\n      <div class=\"gm-d-main\" style=\"order:2;display:flex;flex-direction:column;gap:22px;min-width:0\">\n\n        <section class=\"gm-d-welcome\" style=\"position:relative;overflow:hidden;background:linear-gradient(150deg,#4B0A73 0%,#600C90 58%,#7A16AC 100%);border-radius:24px;padding:32px 34px;color:#fff;box-shadow:0 18px 40px rgba(60,9,96,0.22)\">\n          <div style=\"position:absolute;top:-70px;right:-50px;width:230px;height:230px;border-radius:999px;background:rgba(255,192,46,0.13)\"><\u002Fdiv>\n          <div style=\"position:relative;display:flex;align-items:center;gap:26px\">\n            <div style=\"flex:1;min-width:0\">\n              <h1 class=\"gm-d-wtitle\" style=\"font-size:29px;font-weight:800;color:#fff\">Welcome back, {{ learner.firstName }}<\u002Fh1>\n              <div style=\"display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap\">\n                <span style=\"font-size:12.5px;font-weight:800;letter-spacing:0.06em;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);padding:5px 12px;border-radius:999px;color:#fff\">{{ learner.userId }}<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"font-size:15.5px;font-weight:500;line-height:1.65;color:#F3EBFA;margin-top:16px;max-width:520px;text-wrap:pretty\">You are just one step closer to mastering new skills and achieving your goals. Dive back into your courses and keep the momentum going! Resume Learning<\u002Fp>\n            <\u002Fdiv>\n            <img class=\"gm-d-books\" src=\"9cf8d2a9-9ca0-491c-a375-bd8d99c546a0\" alt=\"\" style=\"width:128px;height:128px;object-fit:contain;flex:none\">\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <section class=\"gm-d-card\" style=\"background:#fff;border:1px solid #EBE6F1;border-radius:20px;padding:24px;box-shadow:0 10px 28px rgba(60,9,96,0.05);min-width:0\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap\">\n            <h2 style=\"font-size:20px;font-weight:800;color:#2C1947\">My timetable<\u002Fh2>\n            <span style=\"font-size:13px;font-weight:700;color:#7A5A9A\">{{ timetable.weekLabel }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-wrap:wrap;gap:9px;margin-top:18px\">\n            <sc-for list=\"{{ timetable.filters }}\" as=\"f\" hint-placeholder-count=\"3\">\n              <span sc-camel-on-click=\"{{ f.select }}\" style=\"cursor:pointer;font-size:13px;font-weight:700;padding:9px 15px;border-radius:10px;background:{{ f.bg }};color:{{ f.color }};border:1px solid {{ f.border }}\">{{ f.label }}<span style=\"font-weight:600;opacity:0.7;font-size:11.5px\"> {{ f.sub }}<\u002Fspan><\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:18px;overflow-x:auto\">\n            <sc-raw-table style=\"min-width:640px\">\n              <sc-raw-thead>\n                <sc-raw-tr style=\"background:#FAF7FD\">\n                  <sc-raw-th style=\"text-align:center;font-family:'Plus Jakarta Sans';font-size:12px;font-weight:800;color:#7A5A9A;text-transform:uppercase;letter-spacing:0.05em;padding:12px 10px;border-bottom:1px solid #EFE7F6;width:48px\">S/N<\u002Fsc-raw-th>\n                  <sc-raw-th style=\"text-align:left;font-family:'Plus Jakarta Sans';font-size:12px;font-weight:800;color:#7A5A9A;text-transform:uppercase;letter-spacing:0.05em;padding:12px 14px;border-bottom:1px solid #EFE7F6;min-width:160px\">Course<\u002Fsc-raw-th>\n                  <sc-for list=\"{{ timetable.days }}\" as=\"d\" hint-placeholder-count=\"7\">\n                    <sc-raw-th style=\"text-align:left;font-family:'Plus Jakarta Sans';font-size:12px;font-weight:800;color:#7A5A9A;text-transform:uppercase;letter-spacing:0.05em;padding:12px 10px;border-bottom:1px solid #EFE7F6\">{{ d }}<\u002Fsc-raw-th>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ timetable.rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <sc-raw-tr>\n                    <sc-raw-td style=\"text-align:center;font-size:13px;color:#9C8AB2;font-weight:700;padding:14px 10px;border-bottom:1px solid #F6F1FA;vertical-align:top\">{{ r.index }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"padding:14px;border-bottom:1px solid #F6F1FA;vertical-align:top\">\n                      <div style=\"font-family:'Plus Jakarta Sans';font-weight:700;font-size:14.5px;color:#2C1947\">{{ r.course }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:#9C8AB2;margin-top:2px\">{{ r.program }}<\u002Fdiv>\n                    <\u002Fsc-raw-td>\n                    <sc-for list=\"{{ r.slots }}\" as=\"s\" hint-placeholder-count=\"7\">\n                      <sc-raw-td style=\"padding:14px 10px;border-bottom:1px solid #F6F1FA;vertical-align:top\">\n                        <div style=\"font-size:12.5px;font-weight:{{ s.weight }};color:{{ s.color }};line-height:1.35;white-space:nowrap\">{{ s.text }}<\u002Fdiv>\n                      <\u002Fsc-raw-td>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n\n      <!-- RIGHT RAIL: courses to pick -->\n      <div class=\"gm-d-right\" style=\"order:3;display:flex;flex-direction:column;gap:22px;min-width:0\">\n        <section>\n          <div style=\"display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap\">\n            <div style=\"display:flex;gap:4px;flex:1;min-width:0;border-bottom:1px solid #EBE6F1\">\n              <sc-for list=\"{{ picks.tabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n                <span sc-camel-on-click=\"{{ t.select }}\" style=\"cursor:pointer;font-family:'Plus Jakarta Sans';font-size:12.5px;font-weight:800;color:{{ t.color }};padding:8px 2px 9px;border-bottom:2.5px solid {{ t.underline }};margin-bottom:-1px;white-space:nowrap\">{{ t.label }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <a href=\"Courses.dc.html\" style=\"font-size:12.5px;font-weight:700;color:#600C90;padding-bottom:9px\">See all<\u002Fa>\n          <\u002Fdiv>\n\n          <label style=\"display:flex;align-items:center;gap:9px;margin-top:14px;background:#fff;border:1px solid #EBE6F1;border-radius:11px;padding:9px 12px;box-shadow:0 4px 12px rgba(60,9,96,0.04)\" style-focus=\"border-color:#600C90\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9C8AB2\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"flex:none\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M20 20l-4.2-4.2\"><\u002Fpath><\u002Fsvg>\n            <input type=\"text\" placeholder=\"{{ picks.placeholder }}\" value=\"{{ picks.query }}\" sc-camel-on-change=\"{{ picks.onQuery }}\" style=\"flex:1;min-width:0;border:none;outline:none;background:transparent;font-family:'Manrope',sans-serif;font-size:13px;color:#211633\">\n          <\u002Flabel>\n\n          <div class=\"gm-d-picks\" style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px\">\n            <sc-for list=\"{{ picks.courses }}\" as=\"c\" hint-placeholder-count=\"6\">\n              <div style=\"background:#fff;border:1px solid #EBE6F1;border-radius:14px;overflow:hidden;box-shadow:0 6px 16px rgba(60,9,96,0.05);display:flex;flex-direction:column\">\n                <img src=\"{{ c.img }}\" alt=\"{{ c.title }}\" style=\"width:100%;height:62px;object-fit:cover;display:block;background:#F4EDFB\">\n                <div style=\"padding:10px 11px 11px;display:flex;flex-direction:column;flex:1\">\n                  <div style=\"font-family:'Plus Jakarta Sans';font-weight:800;font-size:12.5px;line-height:1.25;color:#2C1947\">{{ c.title }}<\u002Fdiv>\n                  <p style=\"font-size:11px;color:#7A5A9A;margin-top:4px;line-height:1.4;text-wrap:pretty\">{{ c.short }}<\u002Fp>\n                  <div style=\"flex:1;min-height:9px\"><\u002Fdiv>\n                  <a href=\"Course Payment.dc.html\" style=\"display:block;text-align:center;font-size:11.5px;font-weight:800;color:#3C0960;background:#FFC02E;padding:8px;border-radius:8px\" style-hover=\"background:#FFD05A;color:#3C0960\">Subscribe<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ picks.isEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:12px;background:#fff;border:1px dashed #E3D6EF;border-radius:14px;padding:18px;font-size:12.5px;color:#7A5A9A;text-align:center\">{{ picks.emptyText }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ENROLLED COURSES -->\n    <section style=\"margin-top:34px\">\n      <h2 style=\"font-size:22px;font-weight:800;color:#2C1947\">Your courses<\u002Fh2>\n\n      <sc-for list=\"{{ enrolled }}\" as=\"group\" hint-placeholder-count=\"3\">\n        <div style=\"margin-top:24px\">\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <h3 style=\"font-size:16px;font-weight:800;color:#4B0A73\">{{ group.title }}<\u002Fh3>\n            <span style=\"font-size:12px;font-weight:800;color:#7A5A9A;background:#F4EDFB;border:1px solid #EBE0F5;padding:3px 9px;border-radius:999px\">{{ group.count }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ group.isEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:12px;background:#fff;border:1px dashed #E3D6EF;border-radius:16px;padding:22px;font-size:13.5px;color:#7A5A9A\">{{ group.emptyText }}<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div class=\"gm-d-cards\" style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:14px\">\n            <sc-for list=\"{{ group.courses }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <div style=\"background:#fff;border:1px solid #EBE6F1;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(60,9,96,0.05);display:flex;flex-direction:column\">\n                <img src=\"{{ c.img }}\" alt=\"{{ c.title }}\" style=\"width:100%;height:150px;object-fit:cover;display:block;background:#F4EDFB\">\n                <div style=\"padding:18px;display:flex;flex-direction:column;flex:1\">\n                  <div style=\"font-family:'Plus Jakarta Sans';font-weight:800;font-size:16px;color:#2C1947;min-width:0\">{{ c.title }}<\u002Fdiv>\n\n                  <div style=\"height:7px;background:#F1EAF7;border-radius:999px;margin-top:16px;overflow:hidden\">\n                    <div style=\"height:7px;border-radius:999px;background:{{ c.barColor }};width:{{ c.percentWidth }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:12px;color:#7A5A9A;margin-top:7px\">{{ c.progressLabel }}<\u002Fdiv>\n\n                  <div style=\"flex:1;min-height:14px\"><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:10px;margin-top:6px\">\n                    <a href=\"Course Payment.dc.html\" style=\"flex:1;text-align:center;font-size:13.5px;font-weight:800;color:#3C0960;background:#FFC02E;padding:12px 14px;border-radius:11px\" style-hover=\"background:#FFD05A;color:#3C0960\">{{ group.action }}<\u002Fa>\n                    <a href=\"Course Payment.dc.html\" style=\"font-size:13px;font-weight:700;color:#5C5470;padding:12px 10px\">Details<\u002Fa>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1200}}\">\nclass Component extends DCLogic {\n  state = { program: \"all\", pickTab: \"instructor\", pickQuery: \"\" };\n\n  pickCatalog() {\n    return {\n      instructor: [\n        { title: \"STEM & Robotics\", short: \"Hands-on science, coding and robotics.\", img: \"assets/stem-robotics.png\" },\n        { title: \"Project Management (PMP)\", short: \"PMI-aligned prep for the PMP exam.\", img: \"assets/pmp-certification.png\" },\n        { title: \"Software Testing\", short: \"Manual and automated QA skills.\", img: \"assets/software-testing.png\" },\n        { title: \"Data Analytics\", short: \"Excel, SQL and dashboards.\", img: \"assets/data-analytics.png\" },\n        { title: \"UI/UX Design\", short: \"Research, wireframes and handoff.\", img: \"assets/ui-ux-design.png\" },\n        { title: \"Animation\", short: \"Motion basics and 2D character work.\", img: \"assets/animation.png\" }\n      ],\n      self: [\n        { title: \"Product Design\", short: \"UX/UI fundamentals and prototyping.\", img: \"assets/product-design.png\" },\n        { title: \"Web Development\", short: \"HTML, CSS and JavaScript to full-stack.\", img: \"assets/web-development.png\" },\n        { title: \"Web Design\", short: \"Layout, type and responsive pages.\", img: \"assets/web-design.png\" },\n        { title: \"AI Century\", short: \"Practical AI tools for everyday work.\", img: \"assets/ai-century.png\" },\n        { title: \"Flask for Beginners\", short: \"Build your first Python web app.\", img: \"assets/flask-beginner.png\" },\n        { title: \"Intro to Tech\", short: \"A guided start for total beginners.\", img: \"assets/intro-tech.png\" }\n      ]\n    };\n  }\n\n  picksData() {\n    const tabs = [\n      { id: \"instructor\", label: \"Instructor-Led\" },\n      { id: \"self\", label: \"Self-Learn\" }\n    ];\n    const active = this.state.pickTab;\n    const q = this.state.pickQuery.trim().toLowerCase();\n    const all = this.pickCatalog()[active] || [];\n    const courses = q ? all.filter(c => (c.title + \" \" + c.short).toLowerCase().indexOf(q) >= 0) : all;\n    return {\n      tabs: tabs.map(t => ({\n        label: t.label,\n        color: active === t.id ? \"#600C90\" : \"#9C8AB2\",\n        underline: active === t.id ? \"#600C90\" : \"transparent\",\n        select: () => this.setState({ pickTab: t.id })\n      })),\n      query: this.state.pickQuery,\n      placeholder: active === \"instructor\" ? \"Search instructor-led courses\" : \"Search self-learn courses\",\n      onQuery: e => this.setState({ pickQuery: e.target.value }),\n      courses: courses.slice(0, 6),\n      isEmpty: courses.length === 0,\n      emptyText: \"No courses match \\u201C\" + this.state.pickQuery.trim() + \"\\u201D\"\n    };\n  }\n\n  monthGrid() {\n    const now = new Date(2026, 7, 1);\n    const year = now.getFullYear();\n    const month = now.getMonth();\n    const first = new Date(year, month, 1).getDay();\n    const total = new Date(year, month + 1, 0).getDate();\n    const booked = [11, 19, 26];\n    const cells = [];\n    for (let i = 0; i < first; i++) cells.push({ label: \"\", bg: \"transparent\", color: \"#fff\", weight: \"500\", cursor: \"default\" });\n    for (let d = 1; d <= total; d++) {\n      const has = booked.indexOf(d) >= 0;\n      cells.push({\n        label: String(d),\n        bg: has ? \"#600C90\" : \"transparent\",\n        color: has ? \"#fff\" : \"#3F2B57\",\n        weight: has ? \"800\" : \"500\",\n        cursor: has ? \"pointer\" : \"default\"\n      });\n    }\n    return {\n      monthLabel: new Date(year, month).toLocaleString(\"default\", { month: \"long\", year: \"numeric\" }),\n      dayNames: [\"Sun\", \"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\", \"Sat\"],\n      cells,\n      legend: booked.length + \" sessions booked this month\"\n    };\n  }\n\n  timetableData() {\n    return [\n      { course: \"Node.js\", program: \"Backend Development\", slots: { Wed: \"18:00 - 19:30\", Fri: \"18:00 - 19:30\" } },\n      { course: \"Design Thinking\", program: \"Grade 2\", slots: { Sat: \"15:00 - 16:30\" } },\n      { course: \"Critical Thinking\", program: \"Grade 2\", slots: { Sat: \"17:00 - 18:10\" } },\n      { course: \"Databases\", program: \"Backend Development\", slots: { Tue: \"18:00 - 19:30\", Thu: \"18:00 - 19:30\" } }\n    ];\n  }\n\n  renderVals() {\n    const days = [\"Mon\", \"Tue\", \"Wed\", \"Thu\", \"Fri\", \"Sat\", \"Sun\"];\n    const programs = [\n      { id: \"all\", label: \"All programs\", sub: \"\" },\n      { id: \"backend\", label: \"Backend Development\", sub: \"(Semester)\" },\n      { id: \"grade2\", label: \"Grade 2\", sub: \"(Term)\" }\n    ];\n    const nameOf = { backend: \"Backend Development\", grade2: \"Grade 2\" };\n    const active = this.state.program;\n    const rows = this.timetableData()\n      .filter(r => active === \"all\" || r.program === nameOf[active])\n      .map((r, i) => ({\n        index: i + 1,\n        course: r.course,\n        program: r.program,\n        slots: days.map(d => ({\n          text: r.slots[d] || \"\\u2013\",\n          color: r.slots[d] ? \"#600C90\" : \"#CFC2DD\",\n          weight: r.slots[d] ? \"700\" : \"600\"\n        }))\n      }));\n\n    const completed = 3, ongoing = 2, unattempted = 2;\n    const total = completed + ongoing + unattempted;\n    const cDeg = (completed / total) * 360;\n    const oDeg = cDeg + (ongoing / total) * 360;\n\n    return {\n      learner: {\n        firstName: \"Sadiq\",\n        userId: \"LEAR-0000101\",\n        nextUp: \"Next session: Node.js, Wednesday 18:00\"\n      },\n      cal: this.monthGrid(),\n      summary: {\n        total,\n        ring: \"conic-gradient(#600C90 0deg \" + cDeg + \"deg, #FFC02E \" + cDeg + \"deg \" + oDeg + \"deg, #EDE4F5 \" + oDeg + \"deg 360deg)\",\n        rows: [\n          { label: \"Completed\", value: completed, color: \"#600C90\" },\n          { label: \"In progress\", value: ongoing, color: \"#FFC02E\" },\n          { label: \"Not started\", value: unattempted, color: \"#EDE4F5\" }\n        ]\n      },\n      timetable: {\n        weekLabel: \"This week\",\n        days,\n        rows,\n        filters: programs.map(p => ({\n          label: p.label,\n          sub: p.sub,\n          bg: active === p.id ? \"#600C90\" : \"#FAF7FD\",\n          color: active === p.id ? \"#fff\" : \"#5C5470\",\n          border: active === p.id ? \"#600C90\" : \"#EBE6F1\",\n          select: () => this.setState({ program: p.id })\n        }))\n      },\n      picks: this.picksData(),\n      enrolled: [\n        {\n          title: \"In progress\", count: 2, action: \"Resume course\", isEmpty: false, emptyText: \"\",\n          courses: [\n            { title: \"Node.js\", cost: \"\\u20A625,000\", img: \"assets/web-development.png\", percentWidth: \"62%\", barColor: \"linear-gradient(90deg,#600C90,#A855F7)\", progressLabel: \"62% complete\" },\n            { title: \"Design Thinking\", cost: \"\\u20A61,300\", img: \"assets/product-design.png\", percentWidth: \"35%\", barColor: \"linear-gradient(90deg,#600C90,#A855F7)\", progressLabel: \"35% complete\" }\n          ]\n        },\n        {\n          title: \"Completed\", count: 1, action: \"Review course\", isEmpty: false, emptyText: \"\",\n          courses: [\n            { title: \"Intro to Tech\", cost: \"Free\", img: \"assets/intro-tech.png\", percentWidth: \"100%\", barColor: \"#4CAF7D\", progressLabel: \"Passed, certificate ready\" }\n          ]\n        },\n        {\n          title: \"Not started\", count: 2, action: \"Start course\", isEmpty: false, emptyText: \"\",\n          courses: [\n            { title: \"AI Century\", cost: \"\\u20A68,500\", img: \"assets/ai-century.png\", percentWidth: \"0%\", barColor: \"#EDE4F5\", progressLabel: \"Not started yet\" },\n            { title: \"Flask for Beginners\", cost: \"\\u20A69,000\", img: \"assets/flask-beginner.png\", percentWidth: \"0%\", barColor: \"#EDE4F5\", progressLabel: \"Not started yet\" }\n          ]\n        }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
